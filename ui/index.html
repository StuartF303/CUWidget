<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Usage</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="panel" data-tauri-drag-region>
      <header data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>Claude usage</span>
        <span class="status" data-tauri-drag-region>
          <span id="status-dot" class="dot loading" data-tauri-drag-region></span>
          <span id="status-text" data-tauri-drag-region>loading…</span>
        </span>
      </header>
      <div class="row" id="row-five_hour" data-tauri-drag-region>
        <span class="label" data-tauri-drag-region>5h</span>
        <span class="track" data-tauri-drag-region><span class="fill normal" data-tauri-drag-region></span></span>
        <span class="pct" data-tauri-drag-region>—</span>
        <span class="reset" data-tauri-drag-region></span>
      </div>
      <div class="row" id="row-seven_day" data-tauri-drag-region>
        <span class="label" data-tauri-drag-region>7d</span>
        <span class="track" data-tauri-drag-region><span class="fill normal" data-tauri-drag-region></span></span>
        <span class="pct" data-tauri-drag-region>—</span>
        <span class="reset" data-tauri-drag-region></span>
      </div>
      <footer id="footer" data-tauri-drag-region></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
